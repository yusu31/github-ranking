<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⑥ ノートと付箋 — github-ranking v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Klee+One:wght@600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
:root {
  --paper: #f8f2e2; --rule: #e3dccb; --ink: #1d1b17; --sub: #6e6757;
  --hl: #ffe45c;   /* 蛍光ペン（大事な所だけ） */
  --red: #de4f3c;  /* 赤ペン（1位・気になる所） */
  --blue: #cfe5fb; /* 付箋 */
  --hand: "Klee One", "Caveat", cursive;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; color: var(--ink); font-family: "Noto Sans JP", system-ui, sans-serif; font-size: 15px; line-height: 1.75;
  background-color: var(--paper);
  background-image: linear-gradient(to bottom, transparent 31px, var(--rule) 31px, var(--rule) 32px);
  background-size: 100% 32px;
}
button { font: inherit; color: inherit; }
.rings { position: fixed; left: 0; top: 0; bottom: 0; width: 26px; background-image: radial-gradient(circle at 13px 16px, transparent 5px, #d9d1bd 5px, #d9d1bd 6.5px, transparent 7px); background-size: 26px 32px; opacity: .8; pointer-events: none; z-index: 2; }
.page { max-width: 1060px; margin: 0 auto; padding: 0 72px 96px 96px; position: relative; }
.page::before { content: ""; position: absolute; left: 72px; top: 0; bottom: 0; width: 2px; background: #efb2a6; }
.sketch { position: relative; }
.sketch > svg.rough { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); pointer-events: none; overflow: visible; }

/* 上の帯 */
.top { display: flex; align-items: center; gap: 16px; height: 64px; border-bottom: 2px solid var(--ink); }
.mark { width: 40px; height: 40px; background: var(--hl); border-radius: 10px; display: grid; place-items: center; font-family: "Caveat", cursive; font-size: 30px; font-weight: 700; line-height: 1; }
.top .name { font-family: var(--hand); font-size: 20px; }
.top .stamp { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--red); letter-spacing: .12em; }

/* 見開きの上（ひと目） */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 40px; padding-top: 32px; align-items: start; }
.kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--red); margin: 0; line-height: 32px; }
.hero h1 { font-family: var(--hand); font-weight: 600; font-size: 44px; line-height: 64px; margin: 0; letter-spacing: .01em; }
.hero h1, .sticky .o, .sheet p, .line .on { word-break: auto-phrase; }
.hero h1 .hl { white-space: nowrap; background: var(--hl); border-radius: 14px; padding: 0 10px; margin: 0 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.hero h1 .wave { text-decoration: underline wavy var(--red); text-decoration-thickness: 2px; text-underline-offset: 10px; }
.memo { list-style: none; margin: 32px 0 0; padding: 0; }
.memo li { line-height: 32px; display: flex; gap: 10px; }
.memo li::before { content: "✓"; font-family: "Caveat", cursive; font-size: 22px; color: var(--red); width: 16px; flex: none; }
.memo b { font-weight: 700; }

/* 1位の証明書 */
.cert-wrap { padding-top: 40px; }
.cert { background: #fffdf5; border: 1px solid #b89b52; outline: 3px solid #fffdf5; box-shadow: 0 0 0 4px #b89b52, 4px 6px 0 4px rgba(0,0,0,.08); padding: 26px 24px 20px; transform: rotate(-2deg); position: relative; cursor: pointer; }
.cert::before { content: ""; position: absolute; top: -18px; left: 50%; width: 120px; height: 30px; margin-left: -60px; background: rgba(255, 228, 92, .65); transform: rotate(1deg); }
.cert .no { position: absolute; right: -22px; top: -26px; width: 68px; height: 68px; border-radius: 50%; background: var(--hl); border: 2.5px solid var(--ink); display: grid; place-items: center; font-family: "Caveat", cursive; font-size: 40px; font-weight: 700; box-shadow: 2px 3px 0 var(--ink); }
.cert .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: #8a7433; }
.cert .rp { font-family: var(--hand); font-size: 28px; line-height: 1.3; margin: 6px 0 2px; word-break: break-all; }
.cert .ow { font-family: var(--mono); font-size: 12px; color: var(--sub); }
.cert p { margin: 12px 0 0; }
.cert .row { display: flex; gap: 20px; margin-top: 14px; padding-top: 10px; border-top: 1px dashed #c9b57d; font-family: var(--mono); font-size: 12px; color: var(--sub); }
.cert .row b { display: block; color: var(--ink); font-size: 18px; font-weight: 500; }
.cert .seal { position: absolute; right: 18px; bottom: 16px; width: 76px; height: 76px; border-radius: 50%; border: 2px solid rgba(222,79,60,.55); color: rgba(222,79,60,.75); display: grid; place-items: center; text-align: center; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; line-height: 1.3; transform: rotate(-12deg); }
.oval { position: absolute; left: -24px; bottom: -40px; background: var(--blue); border: 2px solid var(--ink); border-radius: 50%; padding: 6px 18px; font-family: "Caveat", cursive; font-size: 20px; transform: rotate(-8deg); box-shadow: 2px 3px 0 var(--ink); }

/* 見出し */
.sec { margin-top: 64px; }
.sec h2 { font-family: var(--hand); font-weight: 600; font-size: 28px; line-height: 64px; margin: 0; display: flex; align-items: baseline; gap: 12px; }
.sec h2 small { font-family: var(--mono); font-size: 12px; color: var(--sub); font-weight: 400; letter-spacing: .08em; }

/* 付箋（あなた向け） */
.stickies { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 20px; margin-top: 8px; }
.sticky { background: #fff4a8; padding: 14px 14px 12px; min-height: 160px; box-shadow: 0 1px 0 rgba(0,0,0,.06), 3px 5px 10px rgba(80,60,0,.12); cursor: pointer; border: 0; text-align: left; transform: rotate(-1.5deg); transition: transform .15s; position: relative; }
.sticky:nth-child(even) { background: var(--blue); }
.sticky:hover, .sticky:focus-visible { transform: rotate(0) translateY(-3px); }
.sticky .k { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--sub); }
.sticky .n { font-family: var(--hand); font-size: 19px; line-height: 1.35; display: block; margin: 4px 0 6px; word-break: break-all; }
.sticky .o { font-size: 13px; line-height: 1.6; display: block; }
.sticky .r { position: absolute; right: 10px; bottom: 8px; font-family: var(--mono); font-size: 12px; }

/* ぜんぶのリスト */
.cat { margin-top: 32px; scroll-margin-top: 16px; }
.cat h3 { font-family: var(--hand); font-weight: 600; font-size: 21px; line-height: 32px; margin: 0; display: inline-block; padding: 0 8px; }
.cat h3 span { font-family: var(--mono); font-size: 12px; color: var(--sub); font-weight: 400; margin-left: 8px; }
.line { display: grid; grid-template-columns: 44px minmax(0, 13em) minmax(0, 1fr) 7.5em; gap: 12px; align-items: center; min-height: 32px; line-height: 32px; cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; padding: 0; }
.line:hover .nm, .line:focus-visible .nm { background: rgba(255, 228, 92, .55); }
.line .rk { font-family: "Caveat", cursive; font-size: 24px; text-align: center; position: relative; line-height: 32px; }
.line .rk svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; overflow: visible; }
.line .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 4px; padding: 0 4px; }
.line .on { color: #3c382f; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line .st { font-family: var(--mono); font-size: 13px; text-align: right; }
.line .st i { font-style: normal; color: var(--red); font-family: "Caveat", cursive; font-size: 16px; margin-right: 6px; }

/* インデックス付箋（右端） */
.tabs { position: fixed; right: 0; top: 120px; display: grid; gap: 6px; z-index: 3; }
.tabs a { display: block; writing-mode: vertical-rl; text-decoration: none; color: var(--ink); background: #fff4a8; padding: 12px 7px 12px 9px; font-family: var(--hand); font-size: 15px; border-radius: 6px 0 0 6px; box-shadow: -2px 2px 0 rgba(0,0,0,.08); transform: translateX(6px); transition: transform .15s; }
.tabs a:nth-child(even) { background: var(--blue); }
.tabs a:hover { transform: translateX(0); }

/* メモ（詳しく） */
.sheet { position: fixed; top: 0; right: 0; height: 100%; width: min(520px, 100%); background: #fffdf5; box-shadow: -10px 0 30px rgba(60,40,0,.18); transform: translateX(104%); transition: transform .3s cubic-bezier(.2,.8,.2,1); z-index: 10; overflow-y: auto; padding: 28px 28px 40px; }
.sheet.on { transform: none; }
.sheet::before { content: ""; position: absolute; top: 0; left: 40px; width: 100px; height: 22px; background: rgba(255, 228, 92, .7); }
.sheet .x { position: absolute; right: 16px; top: 14px; border: 0; background: transparent; font-family: "Caveat", cursive; font-size: 28px; cursor: pointer; line-height: 1; }
.sheet .k { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--red); margin-top: 8px; }
.sheet h3 { font-family: var(--hand); font-weight: 600; font-size: 30px; line-height: 1.3; margin: 4px 0 0; word-break: break-all; }
.sheet .ow { font-family: var(--mono); font-size: 12px; color: var(--sub); }
.sheet h4 { font-family: var(--hand); font-weight: 600; font-size: 18px; margin: 22px 0 4px; }
.sheet p { margin: 0; }
.sheet .one { font-size: 17px; font-weight: 700; margin-top: 14px; }
.sheet .one span { background: linear-gradient(transparent 55%, var(--hl) 55%); }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pc ul { margin: 0; padding: 0; list-style: none; }
.pc li { padding-left: 1.4em; position: relative; margin-bottom: 4px; font-size: 14px; line-height: 1.6; }
.pc li::before { position: absolute; left: 0; top: -4px; font-family: "Caveat", cursive; font-size: 22px; }
.pc .good li::before { content: "✓"; color: #2f7d4a; }
.pc .bad li::before { content: "?"; color: var(--red); }
.use { background: var(--blue); padding: 12px 14px; margin-top: 18px; transform: rotate(-1deg); }
.use b { font-family: var(--hand); font-weight: 600; }
.cmp { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
.cmp th, .cmp td { padding: 6px 6px; border-bottom: 1px dashed #c9bf9f; text-align: center; vertical-align: middle; }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp thead th { font-family: var(--hand); font-weight: 600; font-size: 14px; word-break: break-all; line-height: 1.3; }
.cmp thead th.me { background: var(--hl); }
.cmp td.mk { font-family: "Caveat", cursive; font-size: 22px; line-height: 1; }
.cmp .m2 { color: #2f7d4a; } .cmp .m0 { color: #b3aa94; }
.dim { position: fixed; inset: 0; background: rgba(40,30,10,.25); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9; }
.dim.on { opacity: 1; pointer-events: auto; }

@media (max-width: 860px) {
  body { font-size: 14px; }
  .rings, .page::before { display: none; }
  .page { padding: 0 16px 80px; }
  .top { height: 56px; }
  .top .name { font-size: 17px; white-space: nowrap; }
  .top .stamp { display: none; }
  .hero { grid-template-columns: 1fr; gap: 16px; padding-top: 16px; }
  .hero h1 { font-size: 31px; line-height: 48px; }
  .memo { margin-top: 16px; }
  .cert-wrap { padding: 32px 12px 24px; }
  .cert .no { right: -8px; }
  .stickies { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
  .sticky { min-height: 140px; }
  .sticky .o { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tabs { position: sticky; top: 0; right: auto; display: flex; gap: 6px; overflow-x: auto; background: var(--paper); padding: 8px 16px; margin: 0; max-width: 100%; border-bottom: 1px solid var(--rule); }
  .tabs a { writing-mode: horizontal-tb; padding: 2px 12px; border-radius: 6px; transform: none; flex: none; font-size: 14px; }
  .line { grid-template-columns: 36px minmax(0, 1fr) auto; grid-template-areas: "rk nm st" "rk on on"; line-height: 1.5; padding: 4px 0; row-gap: 0; }
  .line .rk { grid-area: rk; } .line .nm { grid-area: nm; padding: 0; } .line .st { grid-area: st; } .line .on { grid-area: on; white-space: normal; font-size: 13px; line-height: 1.5; }
  .sheet { top: auto; bottom: 0; height: 88%; width: 100%; transform: translateY(104%); border-radius: 14px 14px 0 0; padding: 24px 18px 40px; }
  .sheet.on { transform: none; }
  .pc { grid-template-columns: 1fr; gap: 0; }
}
@media (prefers-reduced-motion: reduce) { .sheet, .dim, .sticky, .tabs a { transition: none; } html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="rings" aria-hidden="true"></div>
<nav class="tabs" id="tabs" aria-label="分類へ移動"></nav>
<div class="page">
  <header class="top">
    <span class="mark" aria-hidden="true">★</span>
    <span class="name">きょうの GitHub ノート</span>
    <span class="stamp" id="stamp"></span>
  </header>

  <section class="hero" aria-label="今日の要点">
    <div>
      <p class="kicker" id="kicker"></p>
      <h1 id="h1"></h1>
      <ul class="memo" id="memo"></ul>
    </div>
    <div class="cert-wrap"><div class="cert" id="cert" tabindex="0" role="button"></div></div>
  </section>

  <section class="sec" aria-labelledby="mineH">
    <h2 id="mineH">あなた向けの付箋 <small id="mineN"></small></h2>
    <div class="stickies" id="stickies"></div>
  </section>

  <section class="sec" aria-labelledby="allH">
    <h2 id="allH">ぜんぶのメモ <small>分類ごと ・ 今日の★順</small></h2>
    <div id="cats"></div>
  </section>
</div>

<div class="dim" id="dim"></div>
<aside class="sheet" id="sheet" aria-hidden="true"></aside>

<script src="../data.js"></script>
<script>
(function () {
  const D = window.V6;
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const rc = window.rough ? window.rough : null; // 読めなくても本文は出る（手描きの線だけ無くなる）

  $("stamp").textContent = `NO.${String(13).padStart(3, "0")} · ${D.date.replaceAll("-", ".")} ${["SUN","MON","TUE","WED","THU","FRI","SAT"][new Date(D.date).getDay()]} · ${D.updated}`;
  $("kicker").textContent = `TODAY'S NOTE · ${D.date.replaceAll("-", ".")} · ${D.items.length} REPOS`;

  // 見出し: 分類名だけ蛍光ペン、件数に赤の波線
  const h1 = $("h1");
  h1.append("きょうは", el("span", "hl", D.lead.cat.label), "が強い。");
  h1.append(el("br"));
  const w = el("span", "wave", `上位5件のうち${D.lead.n}件`);
  h1.append(w, "がそれ。");

  const memo = $("memo");
  const top = D.items[0];
  const li = (parts) => { const l = el("li"); const s = el("span"); parts.forEach((p) => s.append(p)); l.append(s); memo.append(l); };
  li(["あなたの関心は ", el("b", null, `${D.mine.length}件`), `（${D.byInterest.map((x) => x.k + " " + x.n).join("・")}）`]);
  li(["新顔が ", el("b", null, `${D.fresh.length}件`), `。いちばん上は ${D.fresh[0].name}`]);
  li([`${D.veteran.name} は `, el("b", null, `${D.veteran.streak}日連続`), " で載っている"]);

  // 1位の証明書
  const cert = $("cert");
  cert.append(el("div", "no", "1"));
  cert.append(el("div", "lbl", "CERTIFICATE OF TODAY'S No.1"));
  cert.append(el("div", "rp", top.name));
  cert.append(el("div", "ow", top.owner + " / " + top.lang));
  cert.append(el("p", null, top.one));
  const row = el("div", "row");
  [["今日の★", "+" + D.fmt(top.today)], ["★合計", D.fmt(top.stars)], ["前日", top.prev ? top.prev + "位" : "初"]].forEach(([k, v]) => { const d = el("div", null, k); d.append(el("b", null, v)); row.append(d); });
  cert.append(row);
  const seal = el("div", "seal"); seal.append("TRENDING", el("br"), "No.1", el("br"), D.date.slice(5).replace("-", "."));
  cert.append(seal, el("div", "oval", "click me →"));
  cert.addEventListener("click", () => openSheet(top));
  cert.addEventListener("keydown", (e) => { if (e.key === "Enter") openSheet(top); });

  // あなた向けの付箋
  $("mineN").textContent = `${D.mine.length}枚 ・ 関心: ${D.INTERESTS.join(" / ")}`;
  const st = $("stickies");
  D.mine.forEach((it) => {
    const b = el("button", "sticky"); b.type = "button";
    b.append(el("span", "k", it.interest.toUpperCase()), el("span", "n", it.name), el("span", "o", it.one), el("span", "r", `${it.rank}位 +${D.fmt(it.today)}★`));
    b.addEventListener("click", () => openSheet(it));
    st.append(b);
  });

  // 分類ごとのリスト＋右端のインデックス
  const cats = $("cats");
  const tabs = $("tabs");
  D.CATS.forEach((c) => {
    const a = el("a", null, c.label); a.href = "#cat-" + c.id; tabs.append(a);
    const s = el("div", "cat"); s.id = "cat-" + c.id;
    const h = el("h3", "sketch", c.label); h.append(el("span", null, D.byCat(c.id).length + "件")); h.dataset.rough = "under";
    s.append(h);
    D.byCat(c.id).forEach((it) => {
      const b = el("button", "line"); b.type = "button";
      const rk = el("span", "rk", String(it.rank)); if (it.rank <= 3) rk.dataset.circle = "1";
      const stx = el("span", "st"); if (it.move === "new") stx.append(el("i", null, "new!")); stx.append("+" + D.fmt(it.today) + "★");
      b.append(rk, el("span", "nm", it.name), el("span", "on", it.one), stx);
      b.addEventListener("click", () => openSheet(it));
      s.append(b);
    });
    cats.append(s);
  });

  // 詳しく（テープで留めたメモ）
  const sheet = $("sheet"), dim = $("dim");
  function openSheet(it) {
    sheet.textContent = "";
    const x = el("button", "x", "×"); x.type = "button"; x.setAttribute("aria-label", "閉じる"); x.addEventListener("click", closeSheet);
    sheet.append(x, el("div", "k", `${it.rank}位 · ${D.cat(it.cat).label.toUpperCase()} · +${D.fmt(it.today)}★`));
    sheet.append(el("h3", null, it.name), el("div", "ow", `${it.owner} / ${it.lang} / ★${D.fmt(it.stars)} / ${it.streak}日連続`));
    const one = el("p", "one"); one.append(el("span", null, it.one)); sheet.append(one);
    sheet.append(el("h4", null, "どんなもの？"), el("p", null, it.what));
    const pc = el("div", "pc");
    [["good", "いい所", it.pros], ["bad", "気になる所", it.cons]].forEach(([k, t, arr]) => {
      const d = el("div", k); d.append(el("h4", null, t)); const ul = el("ul"); arr.forEach((p) => ul.append(el("li", null, p))); d.append(ul); pc.append(d);
    });
    sheet.append(pc);
    const use = el("div", "use"); use.append(el("b", null, "こう使える → "), it.idea); sheet.append(use);
    // 比較表: 同じ分類の上位3件（この件を含む）
    const peers = D.byCat(it.cat).slice(0, 3); if (!peers.includes(it)) peers[2] = it;
    sheet.append(el("h4", null, `同じ「${D.cat(it.cat).label}」と比べると`));
    const wrap = el("div", "sketch"); wrap.dataset.rough = "box";
    const tb = el("table", "cmp"); const th = el("thead"); const hr = el("tr"); hr.append(el("th", null, ""));
    peers.forEach((p) => hr.append(el("th", p === it ? "me" : null, p.name)));
    th.append(hr); tb.append(th);
    const body = el("tbody");
    D.cat(it.cat).feats.forEach((f, i) => {
      const tr = el("tr"); tr.append(el("td", null, f));
      peers.forEach((p) => tr.append(el("td", "mk m" + p.can[i], p.can[i] === 2 ? "◎" : p.can[i] === 1 ? "△" : "—")));
      body.append(tr);
    });
    tb.append(body); wrap.append(tb); sheet.append(wrap);
    const n = el("p", null, "◎ できる ／ △ 条件つき ／ — できない"); n.style.cssText = "font-size:12px;color:#6e6757;margin-top:8px"; sheet.append(n);
    sheet.classList.add("on"); dim.classList.add("on"); sheet.setAttribute("aria-hidden", "false"); sheet.scrollTop = 0;
    requestAnimationFrame(() => { drawRough(sheet); x.focus({ preventScroll: true }); });
  }
  function closeSheet() { sheet.classList.remove("on"); dim.classList.remove("on"); sheet.setAttribute("aria-hidden", "true"); }
  dim.addEventListener("click", closeSheet);
  addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  // 手描きの線（rough.js）。読めなかったら何もしない
  function drawRough(root) {
    if (!rc) return;
    root.querySelectorAll("[data-rough]").forEach((n) => {
      n.querySelectorAll(":scope > svg.rough").forEach((s) => s.remove());
      const r = n.getBoundingClientRect(); if (!r.width) return;
      const W = r.width + 8, H = r.height + 8;
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("class", "rough"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      const g = rc.svg(svg);
      const seed = n.textContent.length + 7;
      if (n.dataset.rough === "under") svg.append(g.line(2, H - 4, W - 2, H - 6, { stroke: "#1d1b17", strokeWidth: 1.6, roughness: 1.4, seed }));
      else svg.append(g.rectangle(3, 3, W - 6, H - 6, { stroke: "#1d1b17", strokeWidth: 1.3, roughness: 1.2, bowing: 1.5, seed }));
      n.append(svg);
    });
    root.querySelectorAll("[data-circle]").forEach((n) => {
      n.querySelectorAll("svg").forEach((s) => s.remove());
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("width", "40"); svg.setAttribute("height", "34");
      svg.append(rc.svg(svg).ellipse(20, 17, 34, 28, { stroke: "#de4f3c", strokeWidth: 1.6, roughness: 1.6, seed: +n.textContent + 3 }));
      n.append(svg);
    });
  }
  let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => drawRough(document), 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawRough(document)); else drawRough(document);
})();
</script>
