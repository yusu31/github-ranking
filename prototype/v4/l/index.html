<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案L 総選挙速報 — github-ranking v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffdce8; --wine: #5c0f35; --wine2: #7a1a4a; --pink: #e8326f; --gold: #d9a521; --goldl: #f5d77a;
  --ink: #3a0a20; --sub: #7a3a57; --card: #fff; --up: #0b7a4b; --down: #c62f3a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "Noto Sans JP", sans-serif; line-height: 1.6; line-break: strict; word-break: auto-phrase; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.dela { font-family: "Dela Gothic One", sans-serif; font-weight: 400; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }
.num { font-variant-numeric: tabular-nums; }

/* 帯テロップ */
.telop { background: var(--wine); color: #fff; border-bottom: 3px solid var(--gold); }
.telop .in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.telop .flag { background: var(--pink); color: #fff; font-size: 20px; padding: 2px 12px; border: 2px solid var(--goldl); }
.telop h1 { margin: 0; font-size: 22px; color: var(--goldl); line-height: 1.3; }
.telop .upd { margin-left: auto; font-size: 13px; color: #ffd6e4; }
.news { background: var(--ink); color: #fff; font-size: 14px; font-weight: 500; }
.news .in { max-width: 760px; margin: 0 auto; padding: 6px 16px; }
.news b { color: var(--goldl); margin-right: 8px; }
.days { display: flex; gap: 8px; margin: 14px 0 6px; }
.days button { flex: 1; background: #fff; border: 2px solid var(--wine); border-radius: 4px; padding: 6px 0; font-weight: 700; font-size: 15px; }
.days button:hover { background: var(--goldl); }
.days button[aria-current="true"] { background: var(--wine); color: var(--goldl); }
.days small { display: block; font-size: 12px; font-weight: 400; }
.stale { background: #fff3c4; border: 2px solid #c99700; padding: 10px 14px; font-weight: 700; font-size: 14px; margin: 10px 0; }
.hall { font-size: 14px; color: var(--sub); margin: 8px 0 0; }
.hall b { background: var(--gold); color: var(--ink); padding: 0 6px; }

/* センター */
.stage { position: relative; background: var(--wine2); margin-top: 14px; border: 2px solid var(--gold); overflow: hidden; padding: 22px 14px 20px; }
.stage .rays { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.center { position: relative; z-index: 1; display: block; width: min(440px, 100%); margin: 0 auto; background: #fff; border: 3px solid var(--gold); outline: 1px solid var(--wine); outline-offset: -8px; padding: 16px 16px 14px; text-align: center; cursor: pointer; }
.center .crown { display: inline-block; background: var(--pink); color: #fff; font-size: 15px; padding: 2px 14px; border: 2px solid var(--goldl); }
.center .ident-w { display: flex; justify-content: center; margin: 10px 0 6px; }
.center .ident-w .ident { border: 3px solid var(--gold); border-radius: 50%; }
.center h2 { margin: 0; font-size: 22px; font-family: "Dela Gothic One", sans-serif; font-weight: 400; overflow-wrap: anywhere; line-height: 1.3; }
.center h2 .own { display: block; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 14px; color: var(--sub); }
.center p { margin: 6px 0 8px; font-size: 15px; line-height: 1.7; }
.center .votes { font-family: "Dela Gothic One", sans-serif; font-size: 56px; line-height: 1; color: var(--pink); }
.center .votes small { font-size: 14px; color: var(--ink); margin-left: 4px; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; display: inline-block; }
.center .sub { font-size: 13px; color: var(--sub); display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
.fav { position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; border: 2px solid var(--wine); background: #fff; color: #8a6a7a; font-size: 18px; display: grid; place-items: center; border-radius: 50%; }
.fav.on { background: var(--gold); color: var(--ink); }
.fav.pop { animation: pop .26s ease-out; }
@keyframes pop { 50% { transform: scale(1.25); } }
.chg { font-weight: 700; font-size: 13px; }
.chg.up { color: var(--up); } .chg.down { color: var(--down); } .chg.same { color: var(--sub); }
.chg.new { background: var(--gold); color: var(--ink); padding: 0 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: -1px; border: 1px solid rgba(58,10,32,.4); }

/* 名札 */
.sec { margin: 26px 0 10px; flex-wrap: wrap; display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--wine); padding-bottom: 4px; }
.sec h3 { white-space: nowrap; margin: 0; font-size: 20px; font-family: "Dela Gothic One", sans-serif; font-weight: 400; }
.sec span { font-size: 13px; color: var(--sub); }
.tags { display: grid; gap: 8px; position: relative; }
.tag { position: relative; display: grid; grid-template-columns: 54px 38px minmax(0, 1fr) auto 40px; align-items: center; gap: 12px; background: var(--card); border: 1.5px solid var(--gold); padding: 8px 12px 8px 0; cursor: pointer; box-shadow: 0 3px 0 var(--wine); }
.tag:hover { background: #fff8e0; }
.tag.top5 .no { background: var(--pink); }
.no { align-self: stretch; background: var(--wine); color: #fff; display: grid; place-items: center; font-family: "Dela Gothic One", sans-serif; font-size: 22px; }
.tag .who { min-width: 0; }
.tag .who b { display: block; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag .who b span { color: var(--sub); font-weight: 400; }
.tag .who p { margin: 0; font-size: 14px; line-height: 1.5; color: #4a2036; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tag .prev { display: flex; flex-wrap: wrap; gap: 0 8px; font-size: 12px; color: var(--sub); margin-top: 2px; }
.tag .v { text-align: right; }
.tag .v .st { display: block; font-family: "Dela Gothic One", sans-serif; font-size: 22px; color: var(--pink); line-height: 1.2; }
.tag .v small { font-size: 12px; color: var(--sub); }
.tag .fav { position: static; width: 36px; height: 36px; }

/* 詳しい */
.sheet-wrap { grid-column: 1 / -1; }
.detail { background: #fff8e0; border: 1.5px solid var(--gold); border-top: 0; padding: 12px 14px 14px; margin-top: -8px; }
.detail .en { font-size: 14px; color: var(--sub); word-break: break-word; margin: 0 0 8px; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 70px; }
.bars i { flex: 1; background: var(--wine2); }
.bars i.miss { background: transparent; border: 2px dashed var(--sub); height: 100% !important; }
.bars i.last { background: var(--pink); }
.cap { display: flex; justify-content: space-between; font-size: 13px; color: var(--sub); margin-top: 4px; }
.detail .favbig { margin-top: 8px; border: 2px solid var(--wine); background: #fff; padding: 6px 16px; font-weight: 700; font-size: 14px; }
.detail .favbig.on { background: var(--gold); }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.tabs button { flex: none; background: #fff; border: 2px solid var(--wine); padding: 6px 16px; font-weight: 700; font-size: 14px; }
.tabs button[aria-selected="true"] { background: var(--pink); color: #fff; border-color: var(--wine); }
footer { margin-top: 40px; font-size: 13px; color: var(--sub); line-height: 1.7; }

@media (max-width: 520px) {
  .tag { grid-template-columns: 38px 34px minmax(0, 1fr) auto; gap: 8px; padding-right: 8px; }
  .tag > .fav { display: none; }
  .no { font-size: 18px; }
  .telop h1 { font-size: 18px; }
  .center .votes { font-size: 44px; }
  .tag .v .st { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { .fav.pop { animation: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../v2/shared/data.js"></script>
<script src="../../v2/shared/common.js"></script>
<script src="../../v3/shared/v3.js"></script>
<script>
(function () {
  const P = PROTO, el = P.el, s = P.svg, V = V3;
  let tab = P.day.topics[0].id, open = null;
  const streak = (r) => 1 + (V.hash(r) % 9);           // 仮データ
  const again = (r) => V.hash(r + "r") % 4 === 0;       // 仮データ
  const status = (r) => (streak(r) === 1 ? (again(r) ? "再登場" : "初登場") : "連続" + streak(r) + "日");

  function prevRank(it) {
    const c = V.change(it.repo);
    if (c.kind === "new") return null;
    return c.kind === "up" ? it.rank + c.n : c.kind === "down" ? it.rank - c.n : it.rank;
  }
  function favBtn(repo) {
    const b = el("button", { class: "fav" + (P.fav.has(repo) ? " on" : ""), type: "button", "aria-pressed": String(P.fav.has(repo)), "aria-label": repo + " をお気に入り", "data-fav": repo }, "★");
    b.addEventListener("click", (e) => {
      e.stopPropagation(); const on = P.fav.toggle(repo);
      document.querySelectorAll("[data-fav]").forEach((x) => { if (x.dataset.fav === repo) { x.classList.toggle("on", on); x.setAttribute("aria-pressed", String(on)); } });
      b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    });
    return b;
  }
  function detail(it) {
    const hist = P.history(it.repo, it.stars), vals = hist.filter((h) => h.stars != null).map((h) => h.stars);
    const lo = Math.min(...vals), hi = Math.max(...vals);
    return el("div", { class: "detail" },
      el("p", { class: "en" }, it.desc),
      el("div", { class: "bars", role: "img", "aria-label": "★の推移" }, hist.map((h, i) => el("i", { class: h.stars == null ? "miss" : i === hist.length - 1 ? "last" : "", title: h.date + " ★" + P.fmt(h.stars), style: h.stars == null ? "" : `height:${12 + ((h.stars - lo) / Math.max(1, hi - lo)) * 88}%` }))),
      el("div", { class: "cap" }, el("span", {}, hist[0].date.slice(5).replace("-", "/") + " から（点線は記録の無い日）"), el("span", { class: "num" }, "総★ " + P.fmt(it.stars) + "・" + it.lang)));
  }
  function activate(node, fn) {
    node.addEventListener("click", fn);
    node.addEventListener("keydown", (e) => { if (e.target === node && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); fn(); } });
  }
  function toggle(repo) { open = open === repo ? null : repo; render("none"); }

  function rays() {
    const g = s("svg", { class: "rays", viewBox: "0 0 400 300", preserveAspectRatio: "xMidYMid slice", "aria-hidden": "true" });
    const n = 16;
    for (let i = 0; i < n; i += 2) {
      const a0 = (-80 + (160 / n) * i) * Math.PI / 180, a1 = (-80 + (160 / n) * (i + 1)) * Math.PI / 180, R = 520;
      g.append(s("polygon", { points: `200,-10 ${200 + Math.sin(a0) * R},${-10 + Math.cos(a0) * R} ${200 + Math.sin(a1) * R},${-10 + Math.cos(a1) * R}`, fill: "#8d2257" }));
    }
    g.append(s("ellipse", { cx: 200, cy: 285, rx: 190, ry: 26, fill: "#a02c66" }));
    return g;
  }

  function center(it, animate) {
    const vt = el("span", { class: "num" }, "+" + P.fmt(it.today));
    const c = el("div", { class: "center", tabindex: "0", role: "button", "aria-expanded": String(open === it.repo), "aria-label": `1位 ${it.repo} の詳しい表示` },
      el("span", { class: "crown dela" }, "1位 センター"),
      el("div", { class: "ident-w" }, V.identicon(V.owner(it.repo), 96, 48)),
      el("h2", {}, el("small", { class: "own" }, V.owner(it.repo) + " /"), V.name(it.repo)),
      el("p", {}, it.summary),
      el("div", { class: "votes" }, vt, el("small", {}, "票（今日の★増）")),
      el("div", { class: "sub" }, (() => { const pr = prevRank(it); return el("span", {}, pr ? `前回 ${pr}位` : "前回 圏外"); })(), V.changeEl(it.repo), el("span", {}, el("i", { class: "dot", style: `background:${V.langColor(it.lang)}` }), it.lang), el("span", {}, status(it.repo))),
      favBtn(it.repo));
    if (animate === "count") V.countUp(vt, it.today, "+", 1400);
    activate(c, () => toggle(it.repo));
    return c;
  }
  function tag(it, rk, votes, top5, animate, idx) {
    const st = el("span", { class: "st num" }, "+" + P.fmt(votes));
    if (animate === "count") V.countUp(st, votes, "+", 900 + Math.min(idx, 10) * 60);
    const pr = it.rank != null && it.delta === undefined ? prevRank(it) : null;
    const t = el("div", { class: "tag" + (top5 ? " top5" : ""), "data-key": it.repo, tabindex: "0", role: "button", "aria-expanded": String(open === it.repo), "aria-label": `${rk}位 ${it.repo} の詳しい表示` },
      el("span", { class: "no num" }, rk),
      V.identicon(V.owner(it.repo), 38, 19),
      el("div", { class: "who" }, el("b", {}, el("span", {}, V.owner(it.repo) + "/"), V.name(it.repo)), el("p", {}, it.summary),
        it.delta === undefined ? el("div", { class: "prev" }, el("span", {}, pr ? `前回 ${pr}位` : "前回 圏外"), el("span", {}, status(it.repo))) : null),
      el("div", { class: "v" }, it.delta === null ? el("span", { class: "chg new" }, "NEW") : st, it.delta === undefined ? V.changeEl(it.repo) : null, it.delta === undefined ? null : el("small", {}, "票")),
      favBtn(it.repo));
    activate(t, () => toggle(it.repo));
    return t;
  }
  function brief(items) {
    const cnt = {}; items.forEach((i) => cnt[i.lang] = (cnt[i.lang] || 0) + 1);
    const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 2).map((x) => `${x[0]}（${x[1]}件）`);
    const nw = items.filter((i) => V.change(i.repo).kind === "new").length;
    const total = items.reduce((a, i) => a + i.today, 0);
    return `今日は ${top.join(" と ")} が強い。新顔が ${nw} 件、全体の得票（★増）は ${P.fmt(total)}。`;
  }
  function withDetail(list, mk) {
    const out = [];
    list.forEach((it, i) => { out.push(mk(it, i)); if (open === it.repo) out.push(detail(it)); });
    return out;
  }

  function positions() {
    const m = {};
    document.querySelectorAll(".tag[data-key]").forEach((n) => { if (n.closest("#list25")) m[n.dataset.key] = n.getBoundingClientRect().top; });
    return m;
  }

  function render(animate, before) {
    const day = P.day, items = day.trending.items, app = document.getElementById("app"), dd = P.date;
    const top = items[0], rest = items.slice(1);
    const days = el("div", { class: "days", role: "group", "aria-label": "日付" }, P.data.DATES.map((d) => {
      const b = el("button", { type: "button", "aria-current": String(d === P.date) }, `${+d.slice(5, 7)}/${+d.slice(8)}`, el("small", {}, P.weekday(d) + "曜"));
      b.addEventListener("click", () => { if (d === P.date) return; const pos = positions(); open = null; pending = pos; P.setDate(d); });
      return b;
    }));
    const topic = day.topics.find((t) => t.id === tab) || day.topics[0];
    const tabs = el("div", { class: "tabs", role: "tablist", "aria-label": "ブロック" }, day.topics.map((t) => {
      const b = el("button", { type: "button", role: "tab", "aria-selected": String(t.id === topic.id) }, t.label);
      b.addEventListener("click", () => { tab = t.id; open = null; render("none"); });
      return b;
    }));
    const hall = items.filter((i) => streak(i.repo) >= 7);
    const stage = el("div", { class: "stage" }, rays(), center(top, animate));
    const list = el("div", { class: "tags", id: "list25" }, withDetail(rest, (it, i) => tag(it, i + 2, it.today, i < 4, animate, i)));
    const tlist = el("div", { class: "tags" }, withDetail(topic.items, (it, i) => tag(it, i + 1, it.delta == null ? 0 : it.delta, false, "none", i)));
    app.replaceChildren(
      el("div", { class: "telop" }, el("div", { class: "in" },
        el("span", { class: "flag dela" }, `第${day.issueNo}回 速報`),
        el("h1", { class: "dela" }, "GitHub 急上昇 総選挙"),
        el("span", { class: "upd num" }, `${dd.replace(/-/g, "/")}・${day.updatedAt.slice(11, 16)} JST 更新`))),
      el("div", { class: "news" }, el("div", { class: "in" }, el("b", {}, "速報"), brief(items))),
      el("div", { class: "wrap" },
        days,
        P.state === "stale" ? el("div", { class: "stale", role: "status" }, "⚠ 更新が2日止まっています。表示は 11/10 の記録です。") : null,
        hall.length ? el("p", { class: "hall" }, el("b", {}, "殿堂入り（仮）"), " 7日以上連続: " + hall.slice(0, 3).map((i) => V.name(i.repo)).join("、") + (hall.length > 3 ? ` ほか${hall.length - 3}件` : "")) : null,
        stage,
        open === top.repo ? detail(top) : null,
        el("div", { class: "sec" }, el("h3", {}, "2位〜25位"), el("span", {}, "名札の数字は今日の得票（★増）。前回＝前日の順位")),
        list,
        el("div", { class: "sec" }, el("h3", {}, "ブロック別速報"), el("span", {}, "関心領域ごとの★の増え（前日比）")),
        tabs, tlist,
        el("footer", {}, "案L「総選挙速報」— アイドルの総選挙の開票速報（帯テロップ・センターのスポットライト・得票の数え上げ・前回順位つきの名札）の文法。アイコンは仮の生成で、本番は持ち主の本物の画像。連続日数・初登場・殿堂入りは仮データ。データは架空。")));

    // 日付切替: 名札を前の位置から滑らせる（順位が入れ替わって見える）
    if (before && !P.reduced()) {
      document.querySelectorAll("#list25 .tag[data-key]").forEach((n) => {
        const old = before[n.dataset.key], now = n.getBoundingClientRect().top;
        if (old == null) n.animate([{ opacity: 0, transform: "translateX(-30px)" }, { opacity: 1, transform: "none" }], { duration: 600, easing: "ease-out" });
        else if (Math.abs(old - now) > 1) n.animate([{ transform: `translateY(${old - now}px)` }, { transform: "none" }], { duration: 750, easing: "cubic-bezier(.2,.8,.2,1)" });
      });
    }
  }
  let pending = null;
  P.onDate(() => { const b = pending; pending = null; render("count", b); });
  render("count");
})();
</script>
</body>
</html>
