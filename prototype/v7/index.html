<!doctype html>
<html lang="ja" data-tone="mid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ノート＋ポップ色 — github-ranking v7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Klee+One:wght@600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
:root {
  --paper: #f8f2e2; --rule: #e3dccb; --ink: #1d1b17; --sub: #6e6757;
  --red: #de4f3c;   /* 赤ペン（1位・気になる所・new） */
  --pink: #e6407a;  /* 押せる所・進行バー（①から） */
  --hand: "Klee One", "Caveat", cursive;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  /* 分類の色＝マーカーの色（色が分類の意味。棚・付箋・札・見出しで同じ） */
  --d-agent: #c2185b; --d-ui: #0b6fb0; --d-game: #18804a; --d-dev: #8a6400; --d-data: #5a3fc0;
}
/* 色の濃さ3段（本人に選んでもらう用）。うすい＝①の淡さ／ふつう／こい＝蛍光ペンそのまま */
html[data-tone="soft"] { --m-agent: #ffd6e4; --m-ui: #cdeafd; --m-game: #cff3da; --m-dev: #fff0b3; --m-data: #e2dbff; --hl: #ffeb85; }
html[data-tone="mid"]  { --m-agent: #ffb8d2; --m-ui: #a9d8fa; --m-game: #a8e8c0; --m-dev: #ffe27a; --m-data: #cbbdff; --hl: #ffe45c; }
html[data-tone="bold"] { --m-agent: #ff8fb8; --m-ui: #6fc0f5; --m-game: #6fdc9a; --m-dev: #ffd23c; --m-data: #a897ff; --hl: #ffd91a; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; color: var(--ink); font-family: "Noto Sans JP", system-ui, sans-serif; font-size: 15px; line-height: 1.75;
  background-color: var(--paper);
  background-image: linear-gradient(to bottom, transparent 31px, var(--rule) 31px, var(--rule) 32px);
  background-size: 100% 32px;
}
button { font: inherit; color: inherit; }
.rings { position: fixed; left: 0; top: 0; bottom: 0; width: 26px; background-image: radial-gradient(circle at 13px 16px, transparent 5px, #d9d1bd 5px, #d9d1bd 6.5px, transparent 7px); background-size: 26px 32px; opacity: .8; pointer-events: none; z-index: 2; }
.page { max-width: 1060px; margin: 0 auto; padding: 0 72px 96px 96px; position: relative; }
.page::before { content: ""; position: absolute; left: 72px; top: 0; bottom: 0; width: 2px; background: #efb2a6; }
.sketch { position: relative; }
.sketch > svg.rough { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); pointer-events: none; overflow: visible; }
/* マーカー（蛍光ペン）。分類ごとの色を --mk で渡す */
.mk { background: linear-gradient(transparent 52%, var(--mk, var(--hl)) 52%, var(--mk, var(--hl)) 94%, transparent 94%); padding: 0 .12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.mk-full { background: var(--mk, var(--hl)); border-radius: 12px; padding: 0 10px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.c-agent { --mk: var(--m-agent); --dk: var(--d-agent); } .c-ui { --mk: var(--m-ui); --dk: var(--d-ui); } .c-game { --mk: var(--m-game); --dk: var(--d-game); }
.c-dev { --mk: var(--m-dev); --dk: var(--d-dev); } .c-data { --mk: var(--m-data); --dk: var(--d-data); }

/* 上の帯 */
.top { display: flex; align-items: center; gap: 16px; height: 64px; border-bottom: 2px solid var(--ink); }
.mark { width: 40px; height: 40px; background: var(--hl); border-radius: 10px; display: grid; place-items: center; font-family: "Caveat", cursive; font-size: 30px; font-weight: 700; line-height: 1; }
.top .name { font-family: var(--hand); font-size: 20px; }
.top .stamp { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--red); letter-spacing: .12em; }
.tone { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--sub); }
.tone button { border: 1.5px solid var(--ink); background: #fffdf5; border-radius: 999px; padding: 0 10px; line-height: 22px; font-size: 12px; cursor: pointer; }
.tone button[aria-pressed="true"] { background: var(--hl); font-weight: 700; }

/* 見開きの上（ひと目） */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; padding-top: 32px; align-items: start; }
.kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--red); margin: 0; line-height: 32px; }
.hero h1 { font-family: var(--hand); font-weight: 600; font-size: 36px; line-height: 64px; margin: 0; letter-spacing: .01em; }
.hero h1, .sticky .o, .sheet p, .line .on, .cert p, .memo li { word-break: auto-phrase; }
.hero h1 .wave { text-decoration: underline wavy var(--red); text-decoration-thickness: 2px; text-underline-offset: 10px; }
.hero h1 .mk-full { white-space: nowrap; }
.memo { list-style: none; margin: 32px 0 0; padding: 0; }
.memo li { line-height: 32px; display: flex; gap: 10px; }
.memo li::before { content: "✓"; font-family: "Caveat", cursive; font-size: 22px; color: var(--red); width: 16px; flex: none; }
.memo b { font-weight: 700; }

/* 上位5件の札（自動で切り替わる。下の進行バーは①から） */
.cert-wrap { padding-top: 36px; }
.stack { display: grid; }
.cert { grid-area: 1 / 1; background: #fffdf5; border: 1px solid #b89b52; outline: 3px solid #fffdf5; box-shadow: 0 0 0 4px #b89b52, 4px 6px 0 4px rgba(0,0,0,.08); padding: 26px 24px 20px; transform: rotate(-2deg); position: relative; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .35s, transform .35s; }
.cert.on { opacity: 1; pointer-events: auto; transform: rotate(-2deg); }
.cert::before { content: ""; position: absolute; top: -18px; left: 50%; width: 120px; height: 30px; margin-left: -60px; background: var(--mk); opacity: .9; transform: rotate(1deg); }
.cert .no { position: absolute; right: -22px; top: -26px; width: 68px; height: 68px; border-radius: 50%; background: var(--mk); border: 2.5px solid var(--ink); display: grid; place-items: center; font-family: "Caveat", cursive; font-size: 40px; font-weight: 700; box-shadow: 2px 3px 0 var(--ink); }
.cert .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--dk); font-weight: 500; }
.cert .rp { font-family: var(--hand); font-size: 28px; line-height: 1.3; margin: 6px 0 2px; word-break: break-all; }
.cert .ow { font-family: var(--mono); font-size: 12px; color: var(--sub); }
.cert p { margin: 12px 0 0; }
.cert p.lk { font-size: 13px; color: #4b4638; margin-top: 8px; }
.cert .row { display: flex; gap: 20px; margin-top: 14px; padding-top: 10px; border-top: 1px dashed #c9b57d; font-family: var(--mono); font-size: 12px; color: var(--sub); }
.cert .row b { display: block; color: var(--ink); font-size: 18px; font-weight: 500; }
.cert .seal { position: absolute; right: 18px; bottom: 16px; width: 70px; height: 70px; border-radius: 50%; border: 2px solid rgba(222,79,60,.55); color: rgba(222,79,60,.75); display: grid; place-items: center; text-align: center; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; line-height: 1.3; transform: rotate(-12deg); }
.thumbs { display: grid; grid-template-columns: repeat(5, 1fr); margin-top: 30px; border-top: 1.5px dashed #b6ac90; }
.thumbs button { border: 0; background: transparent; padding: 10px 6px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; position: relative; min-width: 0; justify-content: center; }
.thumbs .sq { width: 34px; height: 34px; border-radius: 8px; background: var(--mk); color: var(--dk); display: grid; place-items: center; font-family: var(--hand); font-weight: 600; font-size: 14px; flex: none; }
.thumbs .t { font-size: 12px; font-weight: 700; color: var(--pink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: none; }
.thumbs button[aria-current="true"] .t { display: block; }
.thumbs .pg { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,.08); display: none; }
.thumbs button[aria-current="true"] .pg { display: block; }
.thumbs .pg i { display: block; height: 100%; width: 0; background: var(--pink); }

/* 見方（初めての人向けの凡例） */
.legend { margin-top: 36px; background: #fffdf5; border: 1.5px solid var(--ink); border-radius: 6px; padding: 12px 16px; font-size: 13px; line-height: 32px; box-shadow: 3px 4px 0 rgba(0,0,0,.08); }
.legend b { font-family: var(--hand); font-weight: 600; font-size: 15px; margin-right: 8px; }
.legend .chip { display: inline-block; padding: 0 10px; border-radius: 999px; background: var(--mk); line-height: 24px; margin: 0 4px 0 0; font-weight: 500; }
.legend .sep { display: inline-block; width: 1px; height: 18px; background: #c9bf9f; margin: 0 10px; vertical-align: middle; }

/* 見出し */
.sec { margin-top: 56px; }
.sec h2 { font-family: var(--hand); font-weight: 600; font-size: 28px; line-height: 64px; margin: 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec h2 small { font-family: var(--mono); font-size: 12px; color: var(--sub); font-weight: 400; letter-spacing: .08em; }

/* 付箋（あなた向け）— 分類の色 */
.stickies { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 20px; margin-top: 8px; }
.sticky { background: var(--mk); padding: 14px 14px 12px; min-height: 168px; box-shadow: 0 1px 0 rgba(0,0,0,.06), 3px 5px 10px rgba(80,60,0,.12); cursor: pointer; border: 0; text-align: left; transform: rotate(-1.5deg); transition: transform .15s; position: relative; }
.sticky:hover, .sticky:focus-visible { transform: rotate(0) translateY(-3px); }
.sticky .k { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--dk); font-weight: 500; }
.sticky .n { font-family: var(--hand); font-size: 19px; line-height: 1.35; display: block; margin: 4px 0 6px; word-break: break-all; }
.sticky .o { font-size: 13px; line-height: 1.6; display: block; }
.sticky .r { position: absolute; right: 10px; bottom: 8px; font-family: var(--mono); font-size: 12px; }

/* ぜんぶのリスト */
.cat { margin-top: 32px; scroll-margin-top: 16px; }
.cat h3 { font-family: var(--hand); font-weight: 600; font-size: 21px; line-height: 32px; margin: 0; display: inline-block; padding: 0 10px; background: var(--mk); border-radius: 4px; }
.cat h3 span { font-family: var(--mono); font-size: 12px; color: var(--sub); font-weight: 400; margin-left: 8px; }
.line { display: grid; grid-template-columns: 44px minmax(0, 13em) minmax(0, 1fr) 4.6em 7.5em; gap: 12px; align-items: center; min-height: 32px; line-height: 32px; cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; padding: 0; }
.line:hover .nm, .line:focus-visible .nm { background: var(--mk); }
.line .rk { font-family: "Caveat", cursive; font-size: 24px; text-align: center; position: relative; line-height: 32px; }
.line .rk svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; overflow: visible; }
.line .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 4px; padding: 0 4px; justify-self: start; max-width: 100%; background: linear-gradient(transparent 58%, var(--mk) 58%, var(--mk) 92%, transparent 92%); }
.line .on { color: #3c382f; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line .lv { font-family: var(--mono); font-size: 11px; color: var(--sub); white-space: nowrap; }
.line .st { font-family: var(--mono); font-size: 13px; text-align: right; }
.line .st i { font-style: normal; color: var(--red); font-family: "Caveat", cursive; font-size: 16px; margin-right: 6px; }

/* インデックス付箋（右端） */
.tabs { position: fixed; right: 0; top: 120px; display: grid; gap: 6px; z-index: 3; }
.tabs a { display: block; writing-mode: vertical-rl; text-decoration: none; color: var(--ink); background: var(--mk); padding: 12px 7px 12px 9px; font-family: var(--hand); font-size: 15px; border-radius: 6px 0 0 6px; box-shadow: -2px 2px 0 rgba(0,0,0,.08); transform: translateX(6px); transition: transform .15s; }
.tabs a:hover { transform: translateX(0); }

/* メモ（詳しく） */
.sheet { position: fixed; top: 0; right: 0; height: 100%; width: min(580px, 100%); background: #fffdf5; box-shadow: -10px 0 30px rgba(60,40,0,.18); transform: translateX(104%); transition: transform .3s cubic-bezier(.2,.8,.2,1); z-index: 10; overflow-y: auto; padding: 28px 28px 48px; }
.sheet.on { transform: none; }
.sheet::before { content: ""; position: absolute; top: 0; left: 40px; width: 100px; height: 22px; background: var(--mk); opacity: .9; }
.sheet .x { position: absolute; right: 16px; top: 14px; border: 0; background: transparent; font-family: "Caveat", cursive; font-size: 28px; cursor: pointer; line-height: 1; }
.sheet .k { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--dk); font-weight: 500; margin-top: 8px; }
.sheet h3 { font-family: var(--hand); font-weight: 600; font-size: 30px; line-height: 1.3; margin: 4px 0 0; word-break: break-all; }
.sheet .ow { font-family: var(--mono); font-size: 12px; color: var(--sub); }
.sheet h4 { font-family: var(--hand); font-weight: 600; font-size: 18px; margin: 24px 0 6px; display: flex; align-items: baseline; gap: 8px; }
.sheet h4 small { font-family: var(--mono); font-size: 11px; color: var(--sub); font-weight: 400; }
.sheet p { margin: 0; }
.sheet .one { font-size: 17px; font-weight: 700; margin-top: 14px; }
.like { margin-top: 14px; padding: 10px 14px; background: var(--mk); border-radius: 4px; transform: rotate(-.6deg); font-size: 14px; }
.like b { font-family: var(--hand); font-weight: 600; }
.words { margin: 0; display: grid; gap: 8px; }
.words div { border-left: 4px solid var(--mk); padding: 2px 0 2px 12px; font-size: 14px; line-height: 1.65; }
.words dt { font-weight: 700; display: inline; } .words dt::after { content: " ＝ "; font-weight: 400; color: var(--sub); }
.words dd { margin: 0; display: inline; }
.eg { border: 1.5px dashed #b6ac90; border-radius: 6px; padding: 12px 14px; font-size: 14px; background: #fffef9; }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pc ul { margin: 0; padding: 0; list-style: none; }
.pc li { padding-left: 1.4em; position: relative; margin-bottom: 4px; font-size: 14px; line-height: 1.6; }
.pc li::before { position: absolute; left: 0; top: -4px; font-family: "Caveat", cursive; font-size: 22px; }
.pc .good li::before { content: "✓"; color: #2f7d4a; }
.pc .bad li::before { content: "!"; color: var(--red); }
.pc h4 { margin-top: 24px; }
.memo-t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.memo-t th, .memo-t td { padding: 7px 8px; border-bottom: 1px dashed #c9bf9f; text-align: left; vertical-align: top; line-height: 1.6; }
.memo-t th { width: 7.5em; font-family: var(--hand); font-weight: 600; white-space: nowrap; }
.memo-t .dots { font-family: var(--mono); letter-spacing: .1em; color: var(--dk); }
.use { background: var(--mk); padding: 12px 14px; margin-top: 22px; transform: rotate(-.8deg); }
.use b { font-family: var(--hand); font-weight: 600; }
.cmp { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
.cmp th, .cmp td { padding: 6px 6px; border-bottom: 1px dashed #c9bf9f; text-align: center; vertical-align: middle; }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp thead th { font-family: var(--hand); font-weight: 600; font-size: 14px; word-break: break-all; line-height: 1.3; }
.cmp thead th.me { background: var(--mk); }
.cmp td.m { font-family: "Caveat", cursive; font-size: 22px; line-height: 1; }
.cmp .m2 { color: #2f7d4a; } .cmp .m0 { color: #b3aa94; }
.cmp td.m2 { background: linear-gradient(transparent 20%, color-mix(in srgb, var(--mk) 55%, transparent) 20%, color-mix(in srgb, var(--mk) 55%, transparent) 80%, transparent 80%); }
.dim { position: fixed; inset: 0; background: rgba(40,30,10,.25); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9; }
.dim.on { opacity: 1; pointer-events: auto; }

@media (max-width: 860px) {
  body { font-size: 14px; overflow-x: clip; } /* 札の切り替えの斜め移動と手描き線のはみ出しを切る */
  .rings, .page::before { display: none; }
  .page { padding: 0 16px 80px; }
  .top { height: 56px; }
  .top { gap: 10px; }
  .top .mark { width: 32px; height: 32px; font-size: 24px; flex: none; }
  .top .name { font-size: 14px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tone button { font-size: 11px; }
  .top .stamp { display: none; }
  .tone { margin-left: auto; flex: none; }
  .tone button { padding: 0 8px; white-space: nowrap; }
  .tone > span { display: none; }
  .hero { grid-template-columns: 1fr; gap: 16px; padding-top: 16px; }
  .hero h1 { font-size: 30px; line-height: 48px; }
  .memo { margin-top: 16px; }
  .cert-wrap { padding: 32px 12px 8px; }
  .cert .no { right: -8px; }
  .thumbs .sq { width: 30px; height: 30px; }
  .thumbs .t { display: none !important; }
  .legend .sep { display: none; }
  .stickies { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
  .sticky { min-height: 150px; }
  .sticky .o { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tabs { position: sticky; top: 0; right: auto; display: flex; gap: 6px; overflow-x: auto; background: var(--paper); padding: 8px 16px; margin: 0; max-width: 100%; border-bottom: 1px solid var(--rule); }
  .tabs a { writing-mode: horizontal-tb; padding: 2px 12px; border-radius: 6px; transform: none; flex: none; font-size: 14px; }
  .line { grid-template-columns: 36px minmax(0, 1fr) auto; grid-template-areas: "rk nm st" "rk on on" "rk lv lv"; line-height: 1.5; padding: 4px 0; row-gap: 0; }
  .line .rk { grid-area: rk; } .line .nm { grid-area: nm; padding: 0 4px; } .line .st { grid-area: st; } .line .lv { grid-area: lv; } .line .on { grid-area: on; white-space: normal; font-size: 13px; line-height: 1.5; }
  .sheet { top: auto; bottom: 0; height: 90%; width: 100%; transform: translateY(104%); border-radius: 14px 14px 0 0; padding: 24px 18px 40px; }
  .sheet.on { transform: none; }
  .pc { grid-template-columns: 1fr; gap: 0; }
  .memo-t th { width: 6.5em; }
}
@media (prefers-reduced-motion: reduce) { .sheet, .dim, .sticky, .tabs a, .cert { transition: none; } html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="rings" aria-hidden="true"></div>
<nav class="tabs" id="tabs" aria-label="分類へ移動"></nav>
<div class="page">
  <header class="top">
    <span class="mark" aria-hidden="true">★</span>
    <span class="name">きょうの GitHub ノート</span>
    <span class="stamp" id="stamp"></span>
    <div class="tone" id="tone" role="group" aria-label="色の濃さ（見本用）"><span>色の濃さ</span></div>
  </header>

  <section class="hero" aria-label="今日の要点">
    <div>
      <p class="kicker" id="kicker"></p>
      <h1 id="h1"></h1>
      <ul class="memo" id="memo"></ul>
    </div>
    <div class="cert-wrap">
      <div class="stack" id="stack"></div>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </section>

  <div class="legend sketch" id="legend" data-rough="box"></div>

  <section class="sec" aria-labelledby="mineH">
    <h2 id="mineH">あなた向けの付箋 <small id="mineN"></small></h2>
    <div class="stickies" id="stickies"></div>
  </section>

  <section class="sec" aria-labelledby="allH">
    <h2 id="allH">ぜんぶのメモ <small>分類ごと ・ 今日の★順</small></h2>
    <div id="cats"></div>
  </section>
</div>

<div class="dim" id="dim"></div>
<aside class="sheet" id="sheet" aria-hidden="true"></aside>

<script src="../v6/data.js"></script>
<script src="./extra.js"></script>
<script>
(function () {
  const D = window.V6;
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const rc = window.rough ? window.rough : null; // 読めなくても本文は出る（手描きの線だけ無くなる）

  // 色の濃さ（?tone=soft|mid|bold でも指定できる）
  const TONES = [["soft", "うすい"], ["mid", "ふつう"], ["bold", "こい"]];
  const setTone = (t) => { document.documentElement.dataset.tone = t; [...$("tone").querySelectorAll("button")].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.t === t))); };
  TONES.forEach(([t, label]) => { const b = el("button", null, label); b.type = "button"; b.dataset.t = t; b.addEventListener("click", () => setTone(t)); $("tone").append(b); });
  const q = new URLSearchParams(location.search).get("tone"); setTone(TONES.some(([t]) => t === q) ? q : "mid");

  $("stamp").textContent = `NO.013 · ${D.date.replaceAll("-", ".")} ${["SUN","MON","TUE","WED","THU","FRI","SAT"][new Date(D.date).getDay()]} · ${D.updated}`;
  $("kicker").textContent = `TODAY'S NOTE · ${D.date.replaceAll("-", ".")} · ${D.items.length} REPOS`;

  // 見出し: 分類名にその分類のマーカー、件数に赤の波線
  const h1 = $("h1");
  const lead = el("span", "mk-full c-" + D.lead.cat.id, D.lead.cat.label);
  h1.append("きょうは", lead, "が強い。", el("br"), el("span", "wave", `上位5件のうち${D.lead.n}件`), "がそれ。");

  const memo = $("memo");
  const li = (parts) => { const l = el("li"); const s = el("span"); parts.forEach((p) => s.append(p)); l.append(s); memo.append(l); };
  li(["あなたの関心に当たるのは ", el("b", null, `${D.mine.length}件`), `（${D.byInterest.map((x) => x.k + " " + x.n).join("・")}）`]);
  li(["はじめて載ったのは ", el("b", null, `${D.fresh.length}件`), `。いちばん上は ${D.fresh[0].name}`]);
  li([`${D.veteran.name} は `, el("b", null, `${D.veteran.streak}日連続`), " で載っている"]);

  // 上位5件の札＋進行バー
  const top5 = D.items.slice(0, 5);
  const stack = $("stack"), thumbs = $("thumbs");
  top5.forEach((it, i) => {
    const c = el("div", "cert c-" + it.cat); c.tabIndex = -1; c.setAttribute("role", "button");
    c.append(el("div", "no", String(it.rank)), el("div", "lbl", `No.${it.rank} · ${D.cat(it.cat).label.toUpperCase()}`), el("div", "rp", it.name), el("div", "ow", it.owner + " / " + it.lang));
    const p = el("p"); p.append(el("span", "mk", it.one)); c.append(p, el("p", "lk", "たとえるなら、" + it.like));
    const row = el("div", "row");
    [["今日の★", "+" + D.fmt(it.today)], ["★合計", D.fmt(it.stars)], ["前日", it.prev ? it.prev + "位" : "初"]].forEach(([k, v]) => { const d = el("div", null, k); d.append(el("b", null, v)); row.append(d); });
    c.append(row);
    const seal = el("div", "seal"); seal.append("TRENDING", el("br"), `No.${it.rank}`, el("br"), D.date.slice(5).replace("-", ".")); c.append(seal);
    c.addEventListener("click", () => openSheet(it));
    stack.append(c);

    const t = el("button", "c-" + it.cat); t.type = "button"; t.setAttribute("aria-label", `${it.rank}位 ${it.name}`);
    const pg = el("span", "pg"); pg.append(el("i"));
    t.append(el("span", "sq", it.rank + "位"), el("span", "t", it.name), pg);
    t.addEventListener("click", () => show(i));
    thumbs.append(t);
  });
  let cur = 0, start = performance.now(), paused = false, pausedAt = 0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function show(i) {
    cur = i; start = performance.now(); pausedAt = 0;
    [...stack.children].forEach((c, k) => { c.classList.toggle("on", k === i); c.tabIndex = k === i ? 0 : -1; });
    [...thumbs.children].forEach((t, k) => { t.setAttribute("aria-current", String(k === i)); t.querySelector(".pg i").style.width = "0"; });
    thumbs.style.gridTemplateColumns = innerWidth > 860 ? [0, 1, 2, 3, 4].map((k) => (k === i ? "2.4fr" : "1fr")).join(" ") : "";
  }
  show(0);
  [stack, thumbs].forEach((n) => { n.addEventListener("mouseenter", () => (paused = true)); n.addEventListener("mouseleave", () => { paused = false; start = performance.now() - pausedAt; }); });
  function tick(now) {
    if (paused) pausedAt = now - start;
    else if (!reduce) { const p = Math.min(1, (now - start) / 5000); thumbs.children[cur].querySelector(".pg i").style.width = p * 100 + "%"; if (p >= 1) show((cur + 1) % top5.length); }
    requestAnimationFrame(tick);
  }
  if (!reduce) requestAnimationFrame(tick);

  // 見方（色＝分類、難しさ、◎△—）
  const lg = $("legend");
  const g1 = el("div"); g1.append(el("b", null, "このノートの見方"), "色は分類：");
  D.CATS.forEach((c) => { g1.append(el("span", "chip c-" + c.id, c.label)); });
  const g2 = el("div", null, "むずかしさ：●○○ 入門 ／ ●●○ ふつう ／ ●●● 上級　　比べる表：◎ できる ／ △ 条件つき ／ — できない");
  lg.append(g1, g2);

  // あなた向けの付箋
  $("mineN").textContent = `${D.mine.length}枚 ・ 関心: ${D.INTERESTS.join(" / ")}`;
  const st = $("stickies");
  D.mine.forEach((it) => {
    const b = el("button", "sticky c-" + it.cat); b.type = "button";
    b.append(el("span", "k", it.interest.toUpperCase() + " ・ " + D.LV[it.lv]), el("span", "n", it.name), el("span", "o", it.one), el("span", "r", `${it.rank}位 +${D.fmt(it.today)}★`));
    b.addEventListener("click", () => openSheet(it));
    st.append(b);
  });

  // 分類ごとのリスト＋右端のインデックス
  const cats = $("cats"), tabs = $("tabs");
  D.CATS.forEach((c) => {
    const a = el("a", "c-" + c.id, c.label); a.href = "#cat-" + c.id; tabs.append(a);
    const s = el("div", "cat c-" + c.id); s.id = "cat-" + c.id;
    const h = el("h3", null, c.label); h.append(el("span", null, D.byCat(c.id).length + "件"));
    s.append(h);
    D.byCat(c.id).forEach((it) => {
      const b = el("button", "line"); b.type = "button";
      const rk = el("span", "rk", String(it.rank)); if (it.rank <= 3) rk.dataset.circle = "1";
      const stx = el("span", "st"); if (it.move === "new") stx.append(el("i", null, "new!")); stx.append("+" + D.fmt(it.today) + "★");
      b.append(rk, el("span", "nm", it.name), el("span", "on", it.one), el("span", "lv", D.lvDots(it.lv) + " " + D.LV[it.lv]), stx);
      b.addEventListener("click", () => openSheet(it));
      s.append(b);
    });
    cats.append(s);
  });

  // 本文の中の用語にマーカー（見つかったものだけ）
  function markTerms(text, terms) {
    const frag = document.createDocumentFragment(); let rest = text;
    const hits = terms.map((t) => [rest.indexOf(t), t]).filter(([i]) => i >= 0).sort((a, b) => a[0] - b[0]);
    let pos = 0;
    hits.forEach(([i, t]) => { if (i < pos) return; frag.append(rest.slice(pos, i)); frag.append(el("span", "mk", t)); pos = i + t.length; });
    frag.append(rest.slice(pos)); return frag;
  }

  // 詳しく（テープで留めたメモ）
  const sheet = $("sheet"), dim = $("dim");
  function openSheet(it) {
    sheet.textContent = ""; sheet.className = "sheet c-" + it.cat;
    const x = el("button", "x", "×"); x.type = "button"; x.setAttribute("aria-label", "閉じる"); x.addEventListener("click", closeSheet);
    sheet.append(x, el("div", "k", `${it.rank}位 · ${D.cat(it.cat).label.toUpperCase()} · +${D.fmt(it.today)}★`));
    sheet.append(el("h3", null, it.name), el("div", "ow", `${it.owner} / ${it.lang} / ★${D.fmt(it.stars)} / ${it.streak}日連続`));
    const one = el("p", "one"); one.append(el("span", "mk", it.one)); sheet.append(one);
    const lk = el("div", "like"); lk.append(el("b", null, "たとえるなら → "), it.like); sheet.append(lk);

    sheet.append(el("h4", null, "どんなもの？"));
    const wp = el("p"); wp.append(markTerms(it.what, it.words.map((w) => w[0].replace(/（.*$/, "")))); sheet.append(wp);

    sheet.append(el("h4", null, "はじめて見る言葉"));
    const dl = el("dl", "words"); it.words.forEach(([w, d]) => { const r = el("div"); r.append(el("dt", null, w), el("dd", null, d)); dl.append(r); }); sheet.append(dl);

    sheet.append(el("h4", null, "たとえば、こんなとき"), el("div", "eg", it.eg));

    const pc = el("div", "pc");
    [["good", "ここが強い", it.pros], ["bad", "ここは注意", it.cons]].forEach(([k, t, arr]) => {
      const d = el("div", k); d.append(el("h4", null, t)); const ul = el("ul"); arr.forEach((p) => ul.append(el("li", null, p))); d.append(ul); pc.append(d);
    });
    sheet.append(pc);

    sheet.append(el("h4", null, "さわる前のメモ"));
    const mt = el("table", "memo-t"), mb = el("tbody");
    const r1 = el("tr"); const d1 = el("td"); d1.append(el("span", "dots", D.lvDots(it.lv)), ` ${D.LV[it.lv]}`); r1.append(el("th", null, "むずかしさ"), d1);
    const r2 = el("tr"); r2.append(el("th", null, "先に要るもの"), el("td", null, it.prereq));
    const r3 = el("tr"); r3.append(el("th", null, "最初の一歩"), el("td", null, it.first));
    mb.append(r1, r2, r3); mt.append(mb); sheet.append(mt);

    // 比較表: 同じ分類の上位3件（この件を含む）
    const peers = D.byCat(it.cat).slice(0, 3); if (!peers.includes(it)) peers[2] = it;
    sheet.append(el("h4", null, `同じ「${D.cat(it.cat).label}」と比べると`));
    const wrap = el("div", "sketch"); wrap.dataset.rough = "box";
    const tb = el("table", "cmp"); const th = el("thead"); const hr = el("tr"); hr.append(el("th", null, ""));
    peers.forEach((p) => hr.append(el("th", p === it ? "me" : null, p.name)));
    th.append(hr); tb.append(th);
    const body = el("tbody");
    D.cat(it.cat).feats.forEach((f, i) => {
      const tr = el("tr"); tr.append(el("td", null, f));
      peers.forEach((p) => tr.append(el("td", "m m" + p.can[i], p.can[i] === 2 ? "◎" : p.can[i] === 1 ? "△" : "—")));
      body.append(tr);
    });
    tb.append(body); wrap.append(tb); sheet.append(wrap);
    const n = el("p", null, "◎ できる ／ △ 条件つき ／ — できない"); n.style.cssText = "font-size:12px;color:#6e6757;margin-top:8px"; sheet.append(n);

    const use = el("div", "use"); use.append(el("b", null, "自分なら、こう使う → "), it.idea); sheet.append(use);
    sheet.classList.add("on"); dim.classList.add("on"); sheet.setAttribute("aria-hidden", "false"); sheet.scrollTop = 0;
    requestAnimationFrame(() => { drawRough(sheet); x.focus({ preventScroll: true }); });
  }
  function closeSheet() { sheet.classList.remove("on"); dim.classList.remove("on"); sheet.setAttribute("aria-hidden", "true"); }
  dim.addEventListener("click", closeSheet);
  addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  // 手描きの線（rough.js）。読めなかったら何もしない
  function drawRough(root) {
    if (!rc) return;
    root.querySelectorAll("[data-rough]").forEach((n) => {
      n.querySelectorAll(":scope > svg.rough").forEach((s) => s.remove());
      const r = n.getBoundingClientRect(); if (!r.width) return;
      const W = r.width + 8, H = r.height + 8;
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("class", "rough"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      svg.append(rc.svg(svg).rectangle(3, 3, W - 6, H - 6, { stroke: "#1d1b17", strokeWidth: 1.3, roughness: 1.2, bowing: 1.5, seed: n.textContent.length + 7 }));
      n.append(svg);
    });
    root.querySelectorAll("[data-circle]").forEach((n) => {
      n.querySelectorAll("svg").forEach((s) => s.remove());
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("width", "40"); svg.setAttribute("height", "34");
      svg.append(rc.svg(svg).ellipse(20, 17, 34, 28, { stroke: "#de4f3c", strokeWidth: 1.6, roughness: 1.6, seed: +n.textContent + 3 }));
      n.append(svg);
    });
  }
  let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => drawRough(document), 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawRough(document)); else drawRough(document);
})();
</script>
</body>
</html>
