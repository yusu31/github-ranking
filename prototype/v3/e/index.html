<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案E リーグ表 — github-ranking v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1d24; --card: #172a33; --line: #243b46; --text: #f1f6f5; --sub: #9db4ba;
  --up: #9be03a; --down: #ff7a6b; --new: #4cc9f0; --zone: #9be03a;
  --gold: #ffc83d; --silver: #c7d2d8; --bronze: #e0915a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: "M PLUS Rounded 1c", sans-serif; font-weight: 500; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--new); outline-offset: 2px; }
.app { max-width: 720px; margin: 0 auto; padding: 18px 16px 64px; }
.num { font-variant-numeric: tabular-nums; }

header { display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: .02em; }
header .upd { margin-left: auto; color: var(--sub); font-size: 13px; }
.days { display: flex; gap: 8px; margin: 14px 0 6px; }
.days button { flex: 1; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 8px 0; font-weight: 700; font-size: 15px; color: var(--sub); transition: border-color .15s, color .15s, transform .1s; }
.days button:hover { border-color: var(--sub); }
.days button:active { transform: scale(.97); }
.days button[aria-current="true"] { border-color: var(--up); color: var(--text); background: #1d3640; }
.days small { display: block; font-size: 11px; font-weight: 500; }
.stale { background: #3d2f12; color: #ffd98a; border-radius: 12px; padding: 10px 14px; font-size: 14px; margin: 10px 0; }

/* 表彰台 */
.podium { display: grid; grid-template-columns: 1fr 1.2fr 1fr; align-items: end; gap: 10px; margin: 22px 0 10px; text-align: center; }
.pod { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; background: none; border: 0; padding: 0; }
.pod .face { position: relative; }
.pod .face .ident { display: block; border-radius: 22px; box-shadow: 0 0 0 4px var(--ring); }
.pod .medal { position: absolute; right: -8px; bottom: -8px; width: 30px; height: 30px; border-radius: 50%; background: var(--ring); color: #1a1a1a; font-weight: 800; display: grid; place-items: center; font-size: 15px; border: 3px solid var(--bg); }
.pod .nm { font-weight: 800; font-size: 15px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 6px; }
.pod .st { color: var(--up); font-weight: 800; font-size: 20px; }
.pod .st small { font-size: 12px; color: var(--sub); font-weight: 500; }
.step { width: 100%; border-radius: 14px 14px 0 0; background: linear-gradient(#1f3842, #172a33); margin-top: 4px; }
.p1 { --ring: var(--gold); } .p2 { --ring: var(--silver); } .p3 { --ring: var(--bronze); }
.p1 .step { height: 64px; } .p2 .step { height: 40px; } .p3 .step { height: 26px; }

/* 一覧 */
.list { background: var(--card); border-radius: 18px; padding: 4px 0; }
.row { display: grid; grid-template-columns: 34px 48px minmax(0, 1fr) auto 40px; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover { background: #1c323c; }
.row.open { background: #1f3842; }
.rk { text-align: center; font-weight: 800; font-size: 17px; color: var(--sub); }
.rk.m { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #1a1a1a; font-size: 15px; }
.rk.m1 { background: var(--gold); } .rk.m2 { background: var(--silver); } .rk.m3 { background: var(--bronze); }
.row .ident { display: block; }
.who b { display: block; font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who b span { color: var(--sub); font-weight: 500; }
.who p { margin: 2px 0 0; font-size: 13.5px; line-height: 1.55; color: #d5e1e3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.score { text-align: right; }
.score .st { display: block; font-weight: 800; font-size: 19px; color: var(--up); }
.chg { font-size: 12px; font-weight: 800; }
.chg.up { color: var(--up); } .chg.down { color: var(--down); } .chg.same { color: var(--sub); }
.chg.new { color: #0f1d24; background: var(--new); border-radius: 6px; padding: 1px 6px; }
.fav { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: transparent; font-size: 18px; color: var(--sub); transition: transform .12s, background-color .15s; }
.fav:hover { border-color: var(--sub); }
.fav.on { background: var(--gold); border-color: var(--gold); color: #1a1a1a; }
.fav.pop { animation: pop .28s ease-out; }
@keyframes pop { 50% { transform: scale(1.25); } }
.zone { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--zone); font-weight: 800; font-size: 13px; letter-spacing: .08em; padding: 10px 0; border-top: 1px solid var(--line); }
.zone::before, .zone::after { content: ""; flex: 1; height: 2px; background: var(--zone); opacity: .35; margin: 0 12px; }

/* 開いた行の詳しい表示 */
.more { grid-column: 1 / -1; padding: 4px 0 6px 46px; display: grid; gap: 8px; }
.more .en { color: var(--sub); font-size: 13px; word-break: break-word; }
.more .fav { display: none; width: auto; padding: 0 16px; font-size: 14px; justify-self: start; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 70px; }
.bars i { flex: 1; background: var(--up); border-radius: 4px 4px 0 0; opacity: .85; }
.bars i.miss { background: transparent; border: 2px dashed var(--line); height: 100% !important; }
.bars i.last { background: var(--gold); opacity: 1; }
.cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); }

/* 関心領域 */
h2 { font-size: 18px; font-weight: 800; margin: 34px 0 10px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.tabs button { flex: none; background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; color: var(--sub); }
.tabs button[aria-selected="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
footer { color: var(--sub); font-size: 12px; margin-top: 36px; line-height: 1.7; }
@media (max-width: 480px) {
  .row { grid-template-columns: 30px 40px minmax(0, 1fr) auto; gap: 10px; }
  .row > .fav { display: none; }
  .more .fav { display: block; }
  .more { padding-left: 0; }
  .podium .ident { width: 64px; height: 64px; }
}
@media (prefers-reduced-motion: reduce) { .fav.pop { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="../../v2/shared/data.js"></script>
<script src="../../v2/shared/common.js"></script>
<script src="../shared/v3.js"></script>
<script>
(function () {
  const P = PROTO, el = P.el, V = V3;
  let open = null, tab = P.data.days[P.date].topics[0].id;

  function favBtn(repo) {
    const b = el("button", { class: "fav" + (P.fav.has(repo) ? " on" : ""), type: "button", "aria-pressed": String(P.fav.has(repo)), "aria-label": repo + " をお気に入り" }, "★");
    b.addEventListener("click", (e) => { e.stopPropagation(); const on = P.fav.toggle(repo); b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); });
    return b;
  }
  function more(it) {
    const hist = P.history(it.repo, it.stars);
    const vals = hist.filter((h) => h.stars != null).map((h) => h.stars);
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const bars = el("div", { class: "bars", role: "img", "aria-label": "★の推移" }, hist.map((h, i) => el("i", { class: h.stars == null ? "miss" : i === hist.length - 1 ? "last" : "", title: h.date + " ★" + P.fmt(h.stars), style: h.stars == null ? "" : `height:${12 + ((h.stars - lo) / Math.max(1, hi - lo)) * 88}%` })));
    return el("div", { class: "more" },
      el("div", { class: "en" }, it.desc),
      bars,
      el("div", { class: "cap" }, el("span", {}, hist[0].date.slice(5).replace("-", "/") + " から（点線は記録の無い日）"), el("span", { class: "num" }, "総★ " + P.fmt(it.stars))),
      favBtn(it.repo));
  }
  function row(it, rankLabel, right) {
    const r = el("div", { class: "row" + (open === it.repo ? " open" : ""), tabindex: "0", role: "button", "aria-expanded": String(open === it.repo) },
      rankLabel,
      V.identicon(V.owner(it.repo), 48, 12),
      el("div", { class: "who" }, el("b", {}, el("span", {}, V.owner(it.repo) + "/"), V.name(it.repo)), el("p", {}, it.summary)),
      right,
      favBtn(it.repo));
    if (open === it.repo) r.append(more(it));
    const toggle = () => { open = open === it.repo ? null : it.repo; render(false); };
    r.addEventListener("click", toggle);
    r.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    return r;
  }

  function render(animate) {
    const day = P.day, items = day.trending.items, app = document.getElementById("app");
    const days = el("div", { class: "days", role: "group", "aria-label": "日付" }, P.data.DATES.map((d) => {
      const b = el("button", { type: "button", "aria-current": String(d === P.date) }, `${+d.slice(5, 7)}/${+d.slice(8)}`, el("small", {}, P.weekday(d) + "曜"));
      b.addEventListener("click", () => { open = null; P.setDate(d); });
      return b;
    }));
    const pods = [1, 0, 2].map((i) => {
      const it = items[i], st = el("span", { class: "num" }, "+0");
      const b = el("button", { class: "pod p" + (i + 1), type: "button", "aria-label": `${i + 1}位 ${it.repo}` },
        el("div", { class: "face" }, V.identicon(V.owner(it.repo), i === 0 ? 88 : 72, 20), el("span", { class: "medal" }, i + 1)),
        el("div", { class: "nm" }, V.name(it.repo)),
        el("div", { class: "st" }, st, el("small", {}, " ★")),
        el("div", { class: "step" }));
      b.addEventListener("click", () => { open = it.repo; render(false); });
      if (animate) V.countUp(st, it.today, "+", 900); else st.textContent = "+" + P.fmt(it.today);
      return b;
    });
    const list = el("div", { class: "list" });
    items.forEach((it, i) => {
      if (i === 5) list.append(el("div", { class: "zone" }, "▲ ここまでが今日の注目 ▲"));
      const st = el("span", { class: "st num" });
      if (animate && i < 10) V.countUp(st, it.today, "+", 700 + i * 40); else st.textContent = "+" + P.fmt(it.today);
      list.append(row(it, i < 3 ? el("span", { class: "rk m m" + (i + 1) }, i + 1) : el("span", { class: "rk num" }, i + 1), el("div", { class: "score" }, st, V.changeEl(it.repo))));
    });

    const topic = day.topics.find((t) => t.id === tab) || day.topics[0];
    const tabs = el("div", { class: "tabs", role: "tablist" }, day.topics.map((t) => {
      const b = el("button", { type: "button", role: "tab", "aria-selected": String(t.id === topic.id) }, t.label);
      b.addEventListener("click", () => { tab = t.id; open = null; render(false); });
      return b;
    }));
    const tlist = el("div", { class: "list" }, topic.items.map((it, i) => row(it, el("span", { class: "rk num" }, i + 1),
      el("div", { class: "score" }, it.delta == null ? el("span", { class: "chg new" }, "NEW") : el("span", { class: "st num" }, "+" + P.fmt(it.delta)), el("span", { class: "chg same" }, "前日比")))));

    app.replaceChildren(
      el("header", {}, el("h1", {}, "今日の急上昇リーグ"), el("span", { class: "upd num" }, day.updatedAt.slice(11, 16) + " 更新")),
      days,
      P.state === "stale" ? el("div", { class: "stale", role: "status" }, "⚠ 更新が2日止まっています。表示は 11/10 の記録です。") : "",
      el("div", { class: "podium" }, pods),
      list,
      el("h2", {}, "関心領域"), tabs, tlist,
      el("footer", {}, "案E「リーグ表」— ゲームのランキングの文法（表彰台・注目ゾーンの帯・順位の上下・数字のカウントアップ）。アイコンは GitHub の初期アバターと同じ作り方の模様で、本番は持ち主の本物のアバター。データは架空。")
    );
  }
  P.onDate(() => render(true));
  render(true);
})();
</script>
</body>
</html>
